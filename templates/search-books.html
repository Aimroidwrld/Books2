{% include 'header.html' %}
{% include 'navigation.html' %}

<h1>Search Books</h1>

<form method="get" class="row g-3 mb-3">
  <div class="col-md-3 position-relative">
    <label class="form-label">Title</label>
    <input type="text" name="title" id="searchBox"
           class="form-control"
           placeholder="Type a title..."
           value="{{ title|default('') }}">
    <div id="titleSuggestions" class="suggestions border bg-white"></div>
  </div>
  <div class="col-md-3">
    <label class="form-label">Author</label>
    <input type="text" name="author" class="form-control"
           value="{{ author|default('') }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Genre</label>
    <input type="text" name="genre" class="form-control"
           value="{{ genre|default('') }}">
  </div>
  <div class="col-md-2">
    <label class="form-label">Year</label>
    <input type="number" name="year" class="form-control"
           value="{{ year|default('') }}">
  </div>
  <div class="col-md-1 d-flex align-items-end">
    <button type="submit" class="btn btn-primary w-100">Search</button>
  </div>
</form>

<h2>Results</h2>
<p>{{ num_rows }} record(s) found.</p>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Title</th><th>Author</th><th>Genre</th><th>Year</th>
    </tr>
  </thead>
  <tbody>
  {% for b in results %}
    <tr>
      <td>{{ b.title }}</td>
      <td>{{ b.author }}</td>
      <td>{{ b.genre }}</td>
      <td>{{ b.pub_year }}</td>
    </tr>
  {% else %}
    <tr>
      <td colspan="4">No matching books.</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% include 'footer.html' %}
